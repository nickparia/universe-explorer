<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gargantua — Black Hole Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 48%, transparent 46%, rgba(0,0,0,0.55) 100%);
  }
  #label {
    position: fixed; left: 20px; bottom: 18px; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(210, 190, 170, 0.5); letter-spacing: 0.18em; text-transform: uppercase;
  }
  #label b { color: rgba(255, 225, 195, 0.85); font-weight: 600; }
  a { color: rgba(255,225,195,0.85); } a:hover { color: #fff; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="label"><b>Gargantua</b> · supermassive black hole<br>drag to orbit · scroll to approach</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createGargantua, updateGargantua } from './js/blackhole.js';

// ── Renderer — same look as engine.js (ACES, exposure 1.2) ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 5000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.2, 0.92));
composer.addPass(new OutputPass());

// ── Star field (engine.js palette) ──
const STAR_COLORS = [[1,.88,.72],[.72,.8,1],[1,.62,.32],[.94,1,.9],[1,1,.58],[.85,.9,1]];
function makeStarTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.4,'rgba(255,255,255,0.3)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(cv);
}
const starTex = makeStarTex();
function starLayer(count, minR, maxR, size, opacity) {
  const pos = new Float32Array(count*3), col = new Float32Array(count*3);
  for (let i = 0; i < count; i++) {
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    const r = minR + Math.random()*(maxR-minR);
    pos[i*3] = r*Math.sin(ph)*Math.cos(th); pos[i*3+1] = r*Math.sin(ph)*Math.sin(th); pos[i*3+2] = r*Math.cos(ph);
    const c = STAR_COLORS[(Math.random()*STAR_COLORS.length)|0];
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat = new THREE.PointsMaterial({ size, map: starTex, vertexColors: true, sizeAttenuation: false,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity });
  return new THREE.Points(geo, mat);
}
scene.add(starLayer(9000, 300, 2500, 1.6, 0.9));
scene.add(starLayer(3000, 200, 1200, 3.0, 0.7));

// ── The black hole (event horizon radius = 1 unit) ──
const bhGroup = new THREE.Group();
scene.add(bhGroup);
createGargantua(bhGroup, 1, { tiltX: 0.14, tiltZ: 0.05 });

// Disk light spills onto nearby objects
const diskLight = new THREE.PointLight(0xff9950, 60, 0, 2);
scene.add(diskLight);
scene.add(new THREE.AmbientLight(0x0a0a12, 0.6));

// A doomed planet drifting past — silhouette for scale, like the film still
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 48, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a2320, roughness: 0.95, metalness: 0.0 })
);
scene.add(planet);

// ── Camera: slow menacing approach + drift, drag to orbit, wheel to zoom ──
let az = 2.35, el = 0.05, dist = 46, targetDist = 19;
let dragging = false, lx = 0, ly = 0, userControl = false;
addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  userControl = true;
  az -= (e.clientX - lx) * 0.004;
  el = Math.max(-1.2, Math.min(1.2, el + (e.clientY - ly) * 0.003));
  lx = e.clientX; ly = e.clientY;
});
addEventListener('wheel', e => {
  userControl = true;
  targetDist = Math.max(13, Math.min(80, targetDist * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

let last = performance.now(), elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; elapsed += dt;

  updateGargantua(dt);

  // slow autonomous drift until the user grabs the camera
  if (!userControl) {
    az += dt * 0.022;
    el = 0.05 + Math.sin(elapsed * 0.11) * 0.02;
  }
  dist += (targetDist - dist) * Math.min(1, dt * 0.25);

  camera.position.set(
    Math.cos(az) * Math.cos(el) * dist,
    Math.sin(el) * dist,
    Math.sin(az) * Math.cos(el) * dist
  );
  camera.lookAt(0, 0, 0);

  // low-frequency tremor — grows as the hole looms closer
  const tr = 0.9 / Math.max(dist, 10);
  camera.position.x += (Math.sin(elapsed * 7.3) * 0.5 + Math.sin(elapsed * 13.1 + 2.0) * 0.3) * tr;
  camera.position.y += (Math.sin(elapsed * 8.9 + 1.0) * 0.5 + Math.sin(elapsed * 15.7) * 0.25) * tr;
  camera.rotation.z += Math.sin(elapsed * 5.1) * 0.0016 * (30 / Math.max(dist, 10));

  // doomed planet — slow retrograde orbit outside the disk
  const pa = elapsed * 0.05 + 1.2;
  planet.position.set(Math.cos(pa) * 14, 2.6, Math.sin(pa) * 14);

  composer.render();
}
animate();
</script>
</body>
</html>
