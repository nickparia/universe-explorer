<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;background:#04060c;overflow:hidden;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
a{color:rgba(140,190,255,0.8);text-decoration:none}a:hover{color:#cfe6ff}
#nav-scroll::-webkit-scrollbar{width:6px}
#nav-scroll::-webkit-scrollbar-thumb{background:rgba(160,200,255,0.25);border-radius:3px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="display:grid;grid-template-columns:380px 1fr;width:100vw;height:100vh;overflow:hidden;background:#04060c">
  <div style="display:flex;flex-direction:column;overflow:hidden;background:rgba(8,10,18,0.92);border-right:1px solid rgba(160,200,255,0.15);box-shadow:4px 0 40px rgba(0,0,0,0.55);color:rgba(255,255,255,0.94);font-weight:300">
    <div style="flex-shrink:0;padding:26px 28px 18px;border-bottom:1px solid rgba(255,255,255,0.06)">
      <div style="font-size:11px;letter-spacing:7px;color:rgba(200,220,255,0.75)">destinations</div>
      <div style="font-size:9px;letter-spacing:3px;margin-top:6px;color:rgba(255,255,255,0.35)">click to target · distances from your position</div>
    </div>
    <div id="nav-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px 60px;scrollbar-width:thin;scrollbar-color:rgba(160,200,255,0.25) transparent">
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
        <div style="margin:28px 0 6px">
          <div style="font-size:10px;letter-spacing:5px;color:{{ sec.titleColor }};padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.06)">{{ sec.title }}</div>
          <sc-for list="{{ sec.items }}" as="item" hint-placeholder-count="4">
            <div onClick="{{ item.select }}" onMouseEnter="{{ item.enter }}" onMouseLeave="{{ item.leave }}" style="display:flex;align-items:center;gap:16px;padding:11px 12px;cursor:pointer;border-radius:2px;border-left:2px solid {{ item.edge }};transition:background 0.15s,border-color 0.15s;background:{{ item.bg }}">
              <div style="width:10px;height:10px;border-radius:50%;flex-shrink:0;background:{{ item.color }};box-shadow:0 0 12px {{ item.color }}"></div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.92)">{{ item.nice }}</div>
                <div style="font-size:9px;letter-spacing:1.2px;margin-top:3px;color:rgba(200,220,255,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ item.short }}</div>
              </div>
              <div style="font-size:9px;letter-spacing:1.5px;color:rgba(160,200,255,0.55);white-space:nowrap;flex-shrink:0">{{ item.dist }}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%, #070b16 0%, #03050c 60%, #010208 100%)">
    <div style="position:absolute;inset:0">
      <canvas ref="{{ canvasRef }}" style="display:block"></canvas>
    </div>
    <div style="position:absolute;top:24px;left:28px;pointer-events:none">
      <div style="font-size:12px;letter-spacing:8px;color:rgba(220,235,255,0.85);text-shadow:0 0 20px rgba(120,180,255,0.4)">star map</div>
      <div style="font-size:9px;letter-spacing:3px;margin-top:7px;color:rgba(180,210,255,0.35)">{{ tier }} view · drag to rotate · scroll to zoom</div>
    </div>
    <a href="starmap-options.dc.html" style="position:absolute;top:24px;right:28px;font-size:9px;letter-spacing:3px;color:rgba(140,190,255,0.4)">← all options</a>
    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:28px;right:28px;bottom:22px;display:flex;align-items:center;gap:22px;padding:16px 22px;background:rgba(8,12,20,0.7);backdrop-filter:blur(10px);border:1px solid rgba(160,200,255,0.18);animation:fadeUp 0.3s ease-out">
        <div style="width:12px;height:12px;border-radius:50%;flex-shrink:0;background:{{ selColor }};box-shadow:0 0 16px {{ selColor }}"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:14px">
            <span style="font-size:16px;letter-spacing:6px;color:rgba(255,255,255,0.95)">{{ selName }}</span>
            <span style="font-size:9px;letter-spacing:4px;color:rgba(120,180,255,0.75)">{{ selKind }}</span>
          </div>
          <div style="font-size:10px;letter-spacing:1.5px;margin-top:5px;color:rgba(255,255,255,0.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ selDesc }}</div>
        </div>
        <div style="font-size:10px;letter-spacing:2px;color:rgba(160,200,255,0.7);white-space:nowrap">{{ selDist }}</div>
        <div onClick="{{ engageWarp }}" style="padding:9px 22px;flex-shrink:0;font-size:10px;letter-spacing:5px;cursor:pointer;color:rgba(120,180,255,0.9);background:rgba(120,180,255,0.06);border:1px solid rgba(120,180,255,0.4);transition:all 0.3s;white-space:nowrap" style-hover="background:rgba(120,180,255,0.12);box-shadow:0 0 24px rgba(120,180,255,0.3)">{{ warpLabel }}</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  canvasRef = React.createRef();
  state = { sections: [], sel: null, selDist: '', tier: 'solar system', hovered: null };
  async componentDidMount(){
    const eng = await import('./starmap-engine.js');
    const data = await import('./starmap-data.js');
    this.eng = eng; this.data = data;
    this.view = new eng.StarMapView(this.canvasRef.current, {
      theme: 'natural',
      autoRotate: this.props.autoRotate ?? true,
      background: true,
      onSelect: d => this.setState({ sel: d, selDist: d ? this.view.distLabel(d) : '' }),
      onTier: t => this.setState({ tier: t }),
    });
    this.view.setData(data.DESTINATIONS);
    this.buildSections();
  }
  buildSections(){
    const { DESTINATIONS, SECTIONS } = this.data;
    const byName = {}; DESTINATIONS.forEach(d => byName[d.name] = d);
    const nice = n => n.toLowerCase();
    const sections = SECTIONS.map(s => ({
      title: s.title,
      titleColor: s.featured ? 'rgba(255,220,120,0.7)' : 'rgba(160,200,255,0.55)',
      items: s.names.map(n => byName[n]).filter(Boolean).map(d => {
        const active = this.state.sel && this.state.sel.name === d.name;
        const hov = this.state.hovered === d.name;
        return {
          nice: nice(d.name), short: d.short, color: d.color,
          dist: this.eng.distanceLabel(d, DESTINATIONS).toLowerCase(),
          bg: active ? 'rgba(120,180,255,0.10)' : hov ? 'rgba(120,180,255,0.06)' : 'transparent',
          edge: active ? 'rgba(120,180,255,0.7)' : 'transparent',
          select: () => {
            const sel = this.view.select(d.name);
            this.setState({ sel, selDist: sel ? this.view.distLabel(sel) : '' });
          },
          enter: () => { this.view.highlight(d.name); this.setState({ hovered: d.name }); },
          leave: () => { this.view.highlight(null); this.setState({ hovered: null }); },
        };
      }),
    }));
    this.setState({ sections });
  }
  componentDidUpdate(_, prev){
    if (this.view) this.view.o.autoRotate = this.props.autoRotate ?? true;
    if (this.data && (prev.sel !== this.state.sel || prev.hovered !== this.state.hovered)) this.buildSections();
  }
  componentWillUnmount(){ if (this.view) this.view.destroy(); }
  renderVals(){
    const s = this.state, sel = s.sel;
    return {
      canvasRef: this.canvasRef,
      sections: s.sections,
      tier: s.tier,
      hasSel: !!sel,
      selName: sel ? sel.name.toLowerCase() : '',
      selKind: sel ? sel.kind : '',
      selDesc: sel ? sel.desc : '',
      selDist: s.selDist,
      selColor: sel ? sel.color : '#8fd8ff',
      warpLabel: sel && sel.type === 'landmark' ? 'engage warp' : 'fly there',
      engageWarp: () => { if (sel) this.view.flyTo(sel.name); },
    };
  }
}
</script>
</body>
</html>
